<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ingresar · Hilos del Alma</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#fbf7f0">
  <link rel="icon" type="image/png" href="assets/img/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500&family=Pinyon+Script&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
  <link rel="stylesheet" href="assets/css/panel.css">
</head>
<body class="login-page">
  <main class="login">
    <a class="login__logo" href="index.html" aria-label="Ir al sitio"><img src="assets/img/logo.webp" alt="Hilos del Alma" width="150" height="166"></a>
    <p class="eyebrow">Acceso privado</p>
    <h1 class="h2">Tu <em>panel</em></h1>
    <p class="muted">Aquí agregas y cambias las piezas que se ven en la página.</p>
    <form class="form" id="login-form" novalidate>
      <div class="field"><label for="email">Correo</label><input id="email" type="email" required autocomplete="username" inputmode="email"></div>
      <div class="field">
        <label for="password">Contraseña</label>
        <div class="pw"><input id="password" type="password" required autocomplete="current-password">
          <button type="button" id="ver" aria-label="Mostrar contraseña">Ver</button></div>
      </div>
      <p id="error" class="login__error" role="alert" hidden></p>
      <button class="btn btn--sage" type="submit" id="entrar">Entrar</button>
    </form>
    <p class="muted login__back"><a class="link" href="index.html">← Volver a la página</a></p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="assets/js/config.js"></script>
  <script>
    (async function () {
      const $ = (id) => document.getElementById(id);
      const err = (t) => { $('error').textContent = t; $('error').hidden = !t; };
      if (!SUPABASE_URL || !SUPABASE_KEY) { err('El panel aún no está conectado a Supabase. Avísale a quien administra el sitio.'); $('entrar').disabled = true; return; }
      const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      if (new URLSearchParams(location.search).get('sin') === 'acceso') err('Esta cuenta no tiene permiso para entrar al panel.');
      else { const { data: { session } } = await sb.auth.getSession(); if (session) { location.href = 'panel.html'; return; } }
      $('ver').addEventListener('click', () => { const p = $('password'); const v = p.type === 'password'; p.type = v ? 'text' : 'password'; $('ver').textContent = v ? 'Ocultar' : 'Ver'; });
      $('login-form').addEventListener('submit', async (e) => {
        e.preventDefault(); err('');
        const email = $('email').value.trim(), password = $('password').value;
        if (!email || !password) return err('Escribe tu correo y tu contraseña.');
        $('entrar').disabled = true; $('entrar').textContent = 'Entrando…';
        const { error } = await sb.auth.signInWithPassword({ email, password });
        if (error) { err(/invalid/i.test(error.message) ? 'El correo o la contraseña no son correctos.' : 'No pudimos entrar: ' + error.message); $('entrar').disabled = false; $('entrar').textContent = 'Entrar'; return; }
        location.href = 'panel.html';
      });
    })();
  </script>
</body>
</html>
